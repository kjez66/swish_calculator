<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kunddisplay</title>
    <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      /* Full-bleed white: there is no web API for screen brightness, so maximising
         emitted light is the only thing the page itself can do for scannability. */
      background: #ffffff;
      color: #111;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
    }
    #pair input {
      font-size: 30px;
      letter-spacing: 8px;
      text-align: center;
      width: 220px;
      padding: 10px;
      border: 2px solid #767676; /* 4.5:1: the field is drawn only by its border */
      border-radius: 10px;
    }
    #pair button {
      margin-top: 14px;
      font-size: 19px;
      padding: 14px 28px;
      border: 0;
      border-radius: 10px;
      /* Darker than the brand-ish #00a54f: white text on that was only 3.2:1. */
      background: #007f3f;
      color: #fff;
      font-weight: 700;
    }
    /* R28: each clamp()/min() has a fixed-px fallback on the line before it.
       Safari before 13.1 (iOS 12) drops the whole clamp()/min() declaration,
       and without a fallback the amount would render at 16px. */
    .amount {
      font-size: 42px;
      font-size: clamp(38px, 12vw, 92px);
      font-weight: 800;
      line-height: 1;
    }
    .note {
      font-size: 18px;
      font-size: clamp(15px, 4.5vw, 24px);
      color: #444;
      margin-top: 6px;
    }
    /* The official Swish file, unmodified (Swish's logo rules forbid editing it).
       The page's white background is the white plate the rules ask for. */
    .logo {
      display: block;
      height: 44px;
      height: clamp(32px, 6vh, 56px);
      width: auto;
      margin: 0 auto 12px;
    }
    #qr svg {
      width: 280px;
      width: min(64vh, 88vw);
      height: auto;
      display: block;
      margin: 14px auto 0;
    }
    .scan {
      font-size: 17px;
      font-size: clamp(15px, 4.2vw, 22px);
      color: #333;
      margin-top: 12px;
    }
    /* A phone propped up sideways is common, and nobody scrolls a customer display:
       in landscape the QR takes the left side at nearly full height and the text
       moves to the right, so everything fits on one screen. */
    #charge {
      display: grid;
      grid-template-areas: "logo" "amount" "note" "qr" "scan";
    }
    #charge .logo {
      grid-area: logo;
    }
    #charge .amount {
      grid-area: amount;
    }
    #charge .note {
      grid-area: note;
    }
    #qr {
      grid-area: qr;
    }
    #charge .scan {
      grid-area: scan;
    }
    @media (orientation: landscape) {
      #charge {
        grid-template-columns: auto auto;
        grid-template-rows: 1fr auto auto 1fr;
        grid-template-areas: "qr logo" "qr amount" "qr note" "qr scan";
        column-gap: 24px;
        align-items: center;
      }
      #qr svg {
        width: 80vh;
        width: min(88vh, 55vw);
        margin: 0;
      }
      #charge .logo {
        align-self: end;
      }
      #charge .scan {
        align-self: start;
      }
      .amount {
        font-size: 40px;
        font-size: clamp(28px, 7vw, 72px);
      }
    }
    .idle-title {
      font-size: 32px;
      font-size: clamp(24px, 8vw, 48px);
      font-weight: 700;
    }
    /* The "approved" check: the circle draws, then the tick, then a small pop.
       Our own plain check, deliberately unlike the Swish app's confirmation.
       #thanks is display:none between sales, and CSS restarts an animation
       when its element is displayed again, so every sale replays it. */
    .approved {
      display: block;
      width: 120px;
      width: clamp(96px, 28vw, 180px);
      height: auto;
      margin: 0 auto 16px;
      animation: approved-pop 0.3s 0.7s ease-out;
    }
    .approved-circle {
      fill: #e8f5ee;
      stroke: #007f3f;
      stroke-width: 3;
      stroke-dasharray: 151; /* circumference 2 × π × 24 ≈ 150.8 */
      stroke-dashoffset: 151;
      animation: approved-draw 0.45s ease-out forwards;
    }
    .approved-check {
      fill: none;
      stroke: #007f3f;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 32; /* path length 7√2 + 15√2 ≈ 31.1 */
      stroke-dashoffset: 32;
      animation: approved-draw 0.3s 0.4s ease-out forwards;
    }
    @keyframes approved-draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes approved-pop {
      50% {
        transform: scale(1.08);
      }
    }
    /* Reduce motion: show the finished check, no drawing or pop. */
    @media (prefers-reduced-motion: reduce) {
      .approved,
      .approved-circle,
      .approved-check {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
    .thanks-text {
      font-size: 18px;
      font-size: clamp(16px, 4.5vw, 24px);
      color: #333;
      margin-top: 8px;
    }
    .hint {
      color: #595959;
      font-size: 14px;
      margin-top: 10px;
    }
    #pairError {
      color: #b00020;
    }
    .wake-hint {
      display: inline-block;
      margin-top: 20px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 15px;
      background: #fff4d6;
      color: #5c4400;
    }
    /* Shown while the live connection is down, so the operator can see the
       display is not following along (it would otherwise look frozen). */
    .status {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px;
      font-size: 14px;
      background: #fff4d6;
      color: #5c4400;
    }
    .repair {
      display: inline-block;
      margin-top: 40px;
      color: #767676; /* discreet, but 4.5:1 (was 2.3:1) */
      font-size: 12px;
    }
    [hidden] {
      display: none !important;
    }
    /* Each screen's main text is its h1 (one visible at a time); the classes
       above set their size, so only the default margin needs resetting. */
    h1 {
      margin: 0;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    </style>
  </head>
  <body>
    <main>
      <form id="pair">
        <h1 class="sr-only">Koppla kunddisplay</h1>
        <p><label for="code">Ange kopplingskoden från kassan.</label></p>
        <input id="code" inputmode="numeric" maxlength="6" placeholder="000000"
          autocomplete="off">
        <div><button id="claim" type="submit">Koppla</button></div>
        <p class="hint" id="pairError" role="alert"></p>
      </form>

      <div id="idle" hidden>
        <h1 class="idle-title">Välkommen</h1>
        <p class="hint">Betala med</p>
        <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
        <p class="wake-hint" id="wakeHint" hidden>
        Tryck en gång på skärmen så håller den sig tänd.
      </p>
        <div><a class="repair" id="repair" href="/display.html?pair">Koppla om</a></div>
      </div>

      <!-- Shown only after the operator pressed Klar, having seen the money land
           in their own Swish app: this page cannot see payments itself. -->
      <div id="thanks" hidden>
        <svg class="approved" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="approved-circle" cx="26" cy="26" r="24" />
          <path class="approved-check" d="M15 27l7 7 15-15" />
        </svg>
        <h1 class="idle-title">Tack!</h1>
        <p class="thanks-text">Betalningen är mottagen</p>
      </div>

      <div id="charge" hidden>
        <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
        <h1 class="amount" id="amount"></h1>
        <div class="note" id="note"></div>
        <div id="qr"></div>
        <div class="scan">Öppna Swish-appen och skanna QR-koden</div>
      </div>
    </main>

    <div class="status" id="status" role="status" hidden>Återansluter…</div>

    <script src="/display.js"></script>
  </body>
</html>
