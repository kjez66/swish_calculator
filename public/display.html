<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kunddisplay</title>
    <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      /* Full-bleed white: there is no web API for screen brightness, so maximising
         emitted light is the only thing the page itself can do for scannability. */
      background: #ffffff;
      color: #111;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
    }
    #pair input {
      font-size: 30px;
      letter-spacing: 8px;
      text-align: center;
      width: 220px;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 10px;
    }
    #pair button {
      margin-top: 14px;
      font-size: 19px;
      padding: 14px 28px;
      border: 0;
      border-radius: 10px;
      /* Darker than the brand-ish #00a54f: white text on that was only 3.2:1. */
      background: #007f3f;
      color: #fff;
      font-weight: 700;
    }
    /* R28: each clamp()/min() has a fixed-px fallback on the line before it.
       Safari before 13.1 (iOS 12) drops the whole clamp()/min() declaration,
       and without a fallback the amount would render at 16px. */
    .amount {
      font-size: 42px;
      font-size: clamp(38px, 12vw, 92px);
      font-weight: 800;
      line-height: 1;
    }
    .note {
      font-size: 18px;
      font-size: clamp(15px, 4.5vw, 24px);
      color: #444;
      margin-top: 6px;
    }
    /* The official Swish file, unmodified (Swish's logo rules forbid editing it).
       The page's white background is the white plate the rules ask for. */
    .logo {
      display: block;
      height: 44px;
      height: clamp(32px, 6vh, 56px);
      width: auto;
      margin: 0 auto 12px;
    }
    #qr svg {
      width: 280px;
      width: min(64vh, 88vw);
      height: auto;
      display: block;
      margin: 14px auto 0;
    }
    .scan {
      font-size: 17px;
      font-size: clamp(15px, 4.2vw, 22px);
      color: #333;
      margin-top: 12px;
    }
    /* A phone propped up sideways is common, and nobody scrolls a customer display:
       in landscape the QR takes the left side at nearly full height and the text
       moves to the right, so everything fits on one screen. */
    #charge {
      display: grid;
      grid-template-areas: "logo" "amount" "note" "qr" "scan";
    }
    #charge .logo {
      grid-area: logo;
    }
    #charge .amount {
      grid-area: amount;
    }
    #charge .note {
      grid-area: note;
    }
    #qr {
      grid-area: qr;
    }
    #charge .scan {
      grid-area: scan;
    }
    @media (orientation: landscape) {
      #charge {
        grid-template-columns: auto auto;
        grid-template-rows: 1fr auto auto 1fr;
        grid-template-areas: "qr logo" "qr amount" "qr note" "qr scan";
        column-gap: 24px;
        align-items: center;
      }
      #qr svg {
        width: 80vh;
        width: min(88vh, 55vw);
        margin: 0;
      }
      #charge .logo {
        align-self: end;
      }
      #charge .scan {
        align-self: start;
      }
      .amount {
        font-size: 40px;
        font-size: clamp(28px, 7vw, 72px);
      }
    }
    .idle-title {
      font-size: 32px;
      font-size: clamp(24px, 8vw, 48px);
      font-weight: 700;
    }
    .hint {
      color: #595959;
      font-size: 14px;
      margin-top: 10px;
    }
    #pairError {
      color: #b00020;
    }
    /* Shown while the live connection is down, so the operator can see the
       display is not following along (it would otherwise look frozen). */
    .status {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 8px;
      font-size: 14px;
      background: #fff4d6;
      color: #5c4400;
    }
    .repair {
      display: inline-block;
      margin-top: 40px;
      color: #aaa;
      font-size: 12px;
    }
    [hidden] {
      display: none !important;
    }
    </style>
  </head>
  <body>
    <form id="pair">
      <p><label for="code">Ange kopplingskoden från kassan.</label></p>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="000000"
        autocomplete="off">
      <div><button id="claim" type="submit">Koppla</button></div>
      <p class="hint" id="pairError" role="alert"></p>
    </form>

    <div id="idle" hidden>
      <div class="idle-title">Välkommen</div>
      <p class="hint">Betala med</p>
      <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
      <div><a class="repair" id="repair" href="/display.html?pair">Koppla om</a></div>
    </div>

    <div id="thanks" hidden>
      <div class="idle-title">Tack!</div>
      <p class="hint">Välkommen åter</p>
    </div>

    <div id="charge" hidden>
      <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
      <div class="amount" id="amount"></div>
      <div class="note" id="note"></div>
      <div id="qr"></div>
      <div class="scan">Öppna Swish-appen och skanna QR-koden</div>
    </div>

    <div class="status" id="status" hidden>Återansluter…</div>

    <script src="/display.js"></script>
  </body>
</html>
