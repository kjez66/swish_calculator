<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kunddisplay</title>
    <style>
    /* Calm & refined, matching the seller page: the phone's own typeface, one
       deep-green accent (#0f6b43, 6.6:1 with white), soft depth, gentle motion.
       R28: each clamp()/min() has a fixed-px fallback on the line before it.
       Safari before 13.1 (iOS 12) drops the whole clamp()/min() declaration. */
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      /* Full-bleed white: there is no web API for screen brightness, so maximising
         emitted light is the only thing the page itself can do for scannability. */
      background: #ffffff;
      color: #15171c;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
    }
    h1 {
      margin: 0;
    }
    [hidden] {
      display: none !important;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Screens fade in instead of snapping. A screen is display:none while
       hidden, and CSS restarts the animation each time it is shown again. */
    main > div,
    main > form {
      animation: screen-in 0.25s cubic-bezier(0.2, 0.7, 0.2, 1);
    }
    @keyframes screen-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
    }

    /* --- the stall's own name, first -------------------------------------- */
    .brand {
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #15171c;
    }
    .brand::after {
      content: "";
      display: block;
      width: 40px;
      height: 2px;
      margin: 10px auto 0;
      border-radius: 1px;
      background: #0f6b43;
    }
    #idle .brand {
      font-size: 34px;
      font-size: clamp(28px, 9vw, 56px);
      line-height: 1.15;
    }
    #charge .brand {
      font-size: 18px;
      font-size: clamp(16px, 4.5vw, 24px);
      margin-bottom: 14px;
    }
    #charge .brand::after {
      margin-top: 8px;
    }
    #thanks .brand {
      font-size: 16px;
      font-size: clamp(15px, 4vw, 20px);
      color: #5b6270;
      margin-top: 28px;
    }
    #thanks .brand::after {
      display: none;
    }

    /* --- welcome ------------------------------------------------------------ */
    .idle-title {
      font-size: 22px;
      font-size: clamp(20px, 5.5vw, 32px);
      font-weight: 400;
      color: #5b6270;
      margin-top: 18px;
    }
    #idle .brand + .idle-title {
      margin-top: 18px;
    }
    .pay-with {
      margin-top: 40px;
      font-size: 14px;
      color: #5b6270;
    }
    /* The official Swish file, unmodified (Swish's logo rules forbid editing it).
       The page's white background is the white plate the rules ask for. */
    .logo {
      display: block;
      height: 36px;
      height: clamp(28px, 5vh, 44px);
      width: auto;
      margin: 8px auto 0;
    }
    .wake-hint {
      display: inline-block;
      margin-top: 24px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 15px;
      background: #fff4d6;
      color: #5c4400;
    }

    /* --- charge ------------------------------------------------------------- */
    .amount {
      font-size: 44px;
      font-size: clamp(40px, 13vw, 96px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .note {
      font-size: 16px;
      font-size: clamp(14px, 4vw, 20px);
      color: #5b6270;
      margin-top: 8px;
    }
    /* The QR on a white card with a soft shadow: depth without dimming the
       code's own quiet zone, which stays pure white. */
    .qr-card {
      display: inline-block;
      margin-top: 18px;
      padding: 10px;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 12px 32px rgba(16, 24, 40, 0.1);
    }
    #qr svg {
      display: block;
      width: 260px;
      width: min(56vh, 80vw);
      height: auto;
      border-radius: 12px;
    }
    #charge .logo {
      margin-top: 18px;
    }
    .scan {
      font-size: 16px;
      font-size: clamp(14px, 4vw, 20px);
      color: #3d434e;
      margin-top: 8px;
    }
    /* A phone propped up sideways is common, and nobody scrolls a customer display:
       in landscape the QR takes the left side at nearly full height and the text
       moves to the right, so everything fits on one screen. */
    #charge {
      display: grid;
      grid-template-areas: "brand" "amount" "note" "qr" "logo" "scan";
      justify-items: center;
    }
    #charge .brand {
      grid-area: brand;
    }
    #charge .amount {
      grid-area: amount;
    }
    #charge .note {
      grid-area: note;
    }
    #charge .qr-card {
      grid-area: qr;
    }
    #charge .logo {
      grid-area: logo;
    }
    #charge .scan {
      grid-area: scan;
    }
    @media (orientation: landscape) {
      #charge {
        grid-template-columns: auto auto;
        grid-template-rows: 1fr auto auto auto auto 1fr;
        grid-template-areas:
          "qr brand" "qr amount" "qr note" "qr logo" "qr scan" "qr .";
        column-gap: 36px;
        align-items: center;
      }
      #charge .qr-card {
        margin: 0;
      }
      #qr svg {
        width: 76vh;
        width: min(80vh, 50vw);
      }
      #charge .brand {
        align-self: end;
      }
      .amount {
        font-size: 40px;
        font-size: clamp(28px, 7vw, 72px);
      }
    }

    /* --- thanks ------------------------------------------------------------- */
    /* The "approved" check: the circle draws, then the tick, then a small pop.
       Our own plain check, deliberately unlike the Swish app's confirmation. */
    .approved {
      display: block;
      width: 120px;
      width: clamp(96px, 28vw, 180px);
      height: auto;
      margin: 0 auto 20px;
      animation: approved-pop 0.3s 0.7s ease-out;
    }
    .approved-circle {
      fill: #e6f2ec;
      stroke: #0f6b43;
      stroke-width: 3;
      stroke-dasharray: 151; /* circumference 2 × π × 24 ≈ 150.8 */
      stroke-dashoffset: 151;
      animation: approved-draw 0.45s ease-out forwards;
    }
    .approved-check {
      fill: none;
      stroke: #0f6b43;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 32; /* path length 7√2 + 15√2 ≈ 31.1 */
      stroke-dashoffset: 32;
      animation: approved-draw 0.3s 0.4s ease-out forwards;
    }
    @keyframes approved-draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    @keyframes approved-pop {
      50% {
        transform: scale(1.08);
      }
    }
    /* Sideways, the height is what runs out: size the check and title by it. */
    @media (orientation: landscape) {
      .approved {
        width: 88px;
        width: min(26vh, 150px);
        margin-bottom: 12px;
      }
      .thanks-title {
        font-size: 30px;
        font-size: min(11vh, 56px);
      }
      #thanks .brand {
        margin-top: 16px;
      }
    }
    .thanks-title {
      font-size: 34px;
      font-size: clamp(28px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .thanks-text {
      font-size: 18px;
      font-size: clamp(16px, 4.5vw, 24px);
      color: #3d434e;
      margin-top: 8px;
    }

    /* --- pairing ------------------------------------------------------------ */
    .pair-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .pair-help {
      color: #5b6270;
      margin: 0 0 18px;
    }
    #pair input {
      font-size: 30px;
      letter-spacing: 8px;
      text-align: center;
      width: 230px;
      padding: 12px;
      border: 2px solid #767676; /* 4.5:1: the field is drawn only by its border */
      border-radius: 14px;
      font-variant-numeric: tabular-nums;
    }
    #pair input:focus-visible,
    #pair button:focus-visible {
      outline: 2px solid #0b62c4;
      outline-offset: 2px;
    }
    #pair button {
      margin-top: 16px;
      min-width: 160px;
      min-height: 52px;
      font-size: 18px;
      font-weight: 600;
      padding: 0 28px;
      border: 0;
      border-radius: 999px;
      background: #0f6b43;
      color: #fff;
    }
    .hint {
      color: #595959;
      font-size: 14px;
      margin-top: 10px;
    }
    #pairError {
      color: #b00020;
    }

    /* Shown while the live connection is down, so the operator can see the
       display is not following along (it would otherwise look frozen). */
    .status {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      background: #fff4d6;
      color: #5c4400;
      box-shadow: 0 4px 12px rgba(16, 24, 40, 0.12);
    }

    /* Reduce motion: screens appear at once and the check is shown finished. */
    @media (prefers-reduced-motion: reduce) {
      main > div,
      main > form,
      .approved,
      .approved-circle,
      .approved-check {
        animation: none;
        stroke-dashoffset: 0;
      }
    }
    </style>
  </head>
  <body>
    <main>
      <form id="pair">
        <h1 class="pair-title">Koppla displayn</h1>
        <p class="pair-help"><label for="code">Ange koden som visas i kassan.</label></p>
        <input id="code" inputmode="numeric" maxlength="6" placeholder="000000"
          autocomplete="off">
        <div><button id="claim" type="submit">Koppla</button></div>
        <p class="hint" id="pairError" role="alert"></p>
      </form>

      <div id="idle" hidden>
        <p class="brand store-name" hidden></p>
        <h1 class="idle-title">Välkommen</h1>
        <p class="pay-with">Betala med</p>
        <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
        <p class="wake-hint" id="wakeHint" hidden>
          Tryck en gång på skärmen så håller den sig tänd.
        </p>
      </div>

      <!-- Shown only after the operator pressed Klar, having seen the money land
           in their own Swish app: this page cannot see payments itself. -->
      <div id="thanks" hidden>
        <svg class="approved" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="approved-circle" cx="26" cy="26" r="24" />
          <path class="approved-check" d="M15 27l7 7 15-15" />
        </svg>
        <h1 class="thanks-title">Tack!</h1>
        <p class="thanks-text">Betalningen är mottagen</p>
        <p class="brand store-name" hidden></p>
      </div>

      <div id="charge" hidden>
        <p class="brand store-name" hidden></p>
        <h1 class="amount" id="amount"></h1>
        <div class="note" id="note"></div>
        <div class="qr-card">
          <div id="qr"></div>
        </div>
        <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
        <div class="scan">Öppna Swish-appen och skanna QR-koden</div>
      </div>
    </main>

    <div class="status" id="status" role="status" hidden>Återansluter…</div>

    <script src="/display.js"></script>
  </body>
</html>
