<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kunddisplay</title>
    <!-- Installable as its own fullscreen app, apart from the till. -->
    <link rel="manifest" href="/display.webmanifest">
    <link rel="apple-touch-icon" href="/icons/display-apple-180.png">
    <link rel="icon" href="/icons/display.svg" type="image/svg+xml">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Display">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="/display.css">
  </head>
  <body>
    <main>
      <form id="pair">
        <h1 class="pair-title">Koppla displayn</h1>
        <p class="pair-help"><label for="code">Ange koden som visas i kassan.</label></p>
        <input id="code" inputmode="numeric" maxlength="6" placeholder="000000"
          autocomplete="off">
        <div><button id="claim" type="submit">Koppla</button></div>
        <p class="hint" id="pairError" role="alert"></p>
      </form>

      <div id="idle" hidden>
        <p class="brand store-name" hidden></p>
        <h1 class="idle-title">Välkommen</h1>
        <p class="pay-with">Betala med</p>
        <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
        <p class="wake-hint" id="wakeHint" hidden>
          Tryck en gång på skärmen så håller den sig tänd.
        </p>
      </div>

      <!-- Shown only after the operator pressed Klar, having seen the money land
           in their own Swish app: this page cannot see payments itself. -->
      <div id="thanks" hidden>
        <svg class="approved" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="approved-circle" cx="26" cy="26" r="24" />
          <path class="approved-check" d="M15 27l7 7 15-15" />
        </svg>
        <h1 class="thanks-title">Tack!</h1>
        <p class="thanks-text">Betalningen är mottagen</p>
        <p class="brand store-name" hidden></p>
      </div>

      <div id="charge" hidden>
        <p class="brand store-name" hidden></p>
        <h1 class="amount" id="amount"></h1>
        <div class="note" id="note"></div>
        <div class="qr-card">
          <div id="qr"></div>
        </div>
        <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
        <div class="scan">Öppna Swish-appen och skanna QR-koden</div>
      </div>
    </main>

    <div class="status" id="status" role="status" hidden>Återansluter…</div>

    <script src="/display.js"></script>
  </body>
</html>
