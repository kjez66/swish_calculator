<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Kunddisplay</title>
    <style>
    :root {
      color-scheme: light;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      /* Full-bleed white: there is no web API for screen brightness, so maximising
         emitted light is the only thing the page itself can do for scannability. */
      background: #ffffff;
      color: #111;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
    }
    #pair input {
      font-size: 30px;
      letter-spacing: 8px;
      text-align: center;
      width: 220px;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 10px;
    }
    #pair button {
      margin-top: 14px;
      font-size: 19px;
      padding: 14px 28px;
      border: 0;
      border-radius: 10px;
      background: #00a54f;
      color: #fff;
    }
    /* R28: each clamp()/min() has a fixed-px fallback on the line before it.
       Safari before 13.1 (iOS 12) drops the whole clamp()/min() declaration,
       and without a fallback the amount would render at 16px. */
    .amount {
      font-size: 42px;
      font-size: clamp(38px, 12vw, 92px);
      font-weight: 800;
      line-height: 1;
    }
    .note {
      font-size: 18px;
      font-size: clamp(15px, 4.5vw, 24px);
      color: #444;
      margin-top: 6px;
    }
    /* The official Swish file, unmodified (Swish's logo rules forbid editing it).
       The page's white background is the white plate the rules ask for. */
    .logo {
      display: block;
      height: 44px;
      height: clamp(32px, 6vh, 56px);
      width: auto;
      margin: 0 auto 12px;
    }
    #qr svg {
      width: 280px;
      width: min(68vh, 88vw);
      height: auto;
      display: block;
      margin: 14px auto 0;
    }
    .idle-title {
      font-size: 32px;
      font-size: clamp(24px, 8vw, 48px);
      font-weight: 700;
    }
    .hint {
      color: #777;
      font-size: 14px;
      margin-top: 10px;
    }
    .repair {
      display: inline-block;
      margin-top: 40px;
      color: #aaa;
      font-size: 12px;
    }
    [hidden] {
      display: none !important;
    }
    </style>
  </head>
  <body>
    <div id="pair">
      <p>Ange kopplingskoden från kassan.</p>
      <input id="code" inputmode="numeric" maxlength="6" placeholder="000000">
      <div><button id="claim">Koppla</button></div>
      <p class="hint" id="pairError"></p>
    </div>

    <div id="idle" hidden>
      <div class="idle-title">Välkommen</div>
      <p class="hint">Betala med</p>
      <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
      <div><a class="repair" id="repair" href="/display.html?pair">Koppla om</a></div>
    </div>

    <div id="charge" hidden>
      <img class="logo" src="/brand/swish-logo.svg" alt="Swish">
      <div class="amount" id="amount"></div>
      <div class="note" id="note"></div>
      <div id="qr"></div>
    </div>

    <script src="/display.js"></script>
  </body>
</html>
